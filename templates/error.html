<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title }} - Cyber Mistake Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Unified Application Shell Header -->
    <header class="navbar">
        <div class="nav-content">
            <a href="{{ url_for('home') }}" class="brand-badge">
                <span class="shield-logo-wrap" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </span>
                <span>Cyber Mistake Detector</span>
            </a>

            <div class="nav-status">
                <span class="status-badge badge-warning">HTTP {{ error_code }}</span>
            </div>
        </div>
    </header>

    <!-- Error View -->
    <main class="container" style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
        <section class="card" style="max-width: 480px; width: 100%; text-align: center; padding: 36px 24px;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--status-high-bg); border: 1px solid var(--status-high-border); color: var(--status-high-text); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>

            <h1 style="font-size: 1.25rem; margin-bottom: 8px;">{{ error_title }}</h1>
            <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 24px;">{{ error_message }}</p>

            <a href="{{ url_for('home') }}" class="btn-primary" style="width: 100%;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                <span>Return to Dashboard</span>
            </a>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p><strong>Cyber Mistake Detector</strong> &bull; Educational Defensive Cybersecurity Project</p>
            <p>Safe Execution &bull; Read-Only Local Assessment &bull; Zero External Data Transmission</p>
        </div>
    </footer>

</body>
</html>
